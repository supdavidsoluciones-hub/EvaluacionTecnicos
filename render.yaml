services:
  - type: web
    name: chiriqui-control-operativo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chiriqui-db
          property: connectionString

databases:
  - name: chiriqui-db
    databaseName: chiriqui_operativo
    user: chiriqui_user
