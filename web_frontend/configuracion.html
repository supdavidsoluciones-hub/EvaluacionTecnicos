<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ConfiguraciÃ³n - Control Operativo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/app/css/style.css?v=4">
</head>
<body>
  <div class="top-bar">
    <a href="/app/dashboard.html" class="back-link">â†</a>
    <strong style="font-size: 1.1rem;">CONFIGURACIÃ“N</strong>
  </div>
  <main class="main-container" style="margin-top: 20px;">
      <div class="section" id="configSection" style="animation: fadeUp 0.3s ease; padding-bottom: 80px;">
        <h2 style="margin-bottom: 16px;">âš™ï¸ AdministraciÃ³n</h2>
        
        <div class="quick-access-grid" style="margin-bottom: 24px;">
          <button class="qa-card" onclick="alert('Pronto: Nueva MÃ³vil')" style="border: 1px dashed var(--teal);">
            <div class="qa-icon" style="background: var(--teal-dim); color: var(--teal);">ðŸš</div>
            <div class="qa-label">+ Nueva MÃ³vil</div>
          </button>
          <button class="qa-card" onclick="alert('Pronto: Nuevo TÃ©cnico')" style="border: 1px dashed var(--purple-light);">
            <div class="qa-icon" style="background: var(--purple-dim); color: var(--purple-light);">ðŸ‘¤</div>
            <div class="qa-label">+ Nuevo TÃ©cnico</div>
          </button>
        </div>

        <h3 class="section-title">ðŸ‘¥ TÃ©cnicos del Sistema</h3>
        <div id="techConfigList" style="margin-bottom: 24px; display: grid; gap: 8px;">
          <p class="text-muted text-sm">Cargando tÃ©cnicos...</p>
        </div>
        
        <h3 class="section-title">ðŸš MÃ³viles Registradas</h3>
        <div id="mobileConfigList" style="display: grid; gap: 8px;">
          <p class="text-muted text-sm">Cargando mÃ³viles...</p>
        </div>

        <h3 class="section-title" style="margin-top:24px;">📝 Editor de Checklist (Formulario)</h3>
        <div style="background: var(--bg-card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px;">
          <p class="text-muted text-sm" style="margin-bottom: 12px;">Agrega, elimina o reordena las preguntas del formulario de inspección.</p>
          <div id="checklistEditorList" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;"></div>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="newQuestionInput" class="input-control" placeholder="Nueva pregunta..." style="flex:1;">
            <button class="btn btn-primary" onclick="window.addQuestion()">Agregar</button>
          </div>
          <button class="btn btn-secondary btn-full" style="margin-top: 16px;" onclick="window.saveChecklist()">Guardar Cambios del Formulario</button>
          <button class="btn btn-outline btn-full" style="margin-top: 8px; color: var(--red); border-color: var(--red);" onclick="window.resetChecklist()">Restaurar Default</button>
        </div>
      </div>
  </main>
  
  <script type="module">
    import { isAuthenticated, getTechnicians, getMobiles } from '/app/js/app.js';
    if (!isAuthenticated()) window.location.replace('/app/login.html');

    async function loadConfig() {
      try {
        const [techs, mobiles] = await Promise.all([getTechnicians(), getMobiles()]);
        
        const tList = document.getElementById('techConfigList');
        tList.innerHTML = techs.map(t => `<div class="config-card" style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between;">
            <div>
              <strong style="display:block; color: var(--text-main);">${t.full_name}</strong>
              <small style="color: var(--text-muted);">${t.status}</small>
            </div>
            <button class="btn btn-sm btn-outline">Editar</button>
          </div>`).join('') || '<p>No hay tÃ©cnicos.</p>';

        const mList = document.getElementById('mobileConfigList');
        mList.innerHTML = mobiles.map(m => `<div class="config-card" style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between;">
            <div>
              <strong style="display:block; color: var(--text-main);">${m.code} - ${m.zone || 'Sin zona'}</strong>
              <small style="color: var(--text-muted);">${m.plate || 'Sin placa'} | ${m.status}</small>
            </div>
            <button class="btn btn-sm btn-outline">Editar</button>
          </div>`).join('') || '<p>No hay mÃ³viles.</p>';
      } catch (err) {
        console.error(err);
      }
    }
    
    
    const DEFAULT_CHECKLIST = [
      '¿Cumplió con las normas de instalación?',
      '¿Utilizó rutas adecuadas de instalación?',
      '¿Realizó las configuraciones adecuadas dentro del módem, cajas de TV y extensores?',
      '¿Explicó el WiFi y la caja de TV al cliente?',
      '¿Conectó al cliente al WiFi y explicó las bondades del servicio?',
      'Si lleva Eero: ¿Realizó la configuración adecuada del Eero?',
      'Si lleva Eero: ¿Explicó las bondades del Eero al cliente?',
      '¿Realizó bien el cableado de fibra?',
      '¿Realizó el recorrido correcto en NAP?',
      '¿Utilizó los equipos de seguridad adecuadamente? (conos, casco y arnés)',
      '¿Dejó limpia el área de trabajo?'
    ];
    let currentChecklist = JSON.parse(localStorage.getItem('cm_checklist') || 'null') || [...DEFAULT_CHECKLIST];

    function renderChecklistEditor() {
      const list = document.getElementById('checklistEditorList');
      if(!list) return;
      list.innerHTML = '';
      currentChecklist.forEach((q, i) => {
        const div = document.createElement('div');
        div.style = 'display:flex; gap:8px; align-items:center; background:#f8fafc; padding:8px 12px; border-radius:8px; border:1px solid #e2e8f0;';
        div.innerHTML = `
          <span style="font-weight:700; color:var(--teal);">${i+1}.</span>
          <input type="text" class="input-control" style="flex:1; padding:4px 8px;" value="${q}" onchange="window.updateQuestion(${i}, this.value)">
          <button style="background:var(--red); color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;" onclick="window.removeQuestion(${i})">X</button>
        `;
        list.appendChild(div);
      });
    }

    window.addQuestion = function() {
      const inp = document.getElementById('newQuestionInput');
      if (inp.value.trim()) {
        currentChecklist.push(inp.value.trim());
        inp.value = '';
        renderChecklistEditor();
      }
    };
    window.updateQuestion = function(i, val) {
      currentChecklist[i] = val.trim();
    };
    window.removeQuestion = function(i) {
      currentChecklist.splice(i, 1);
      renderChecklistEditor();
    };
    window.saveChecklist = function() {
      localStorage.setItem('cm_checklist', JSON.stringify(currentChecklist));
      alert('Checklist guardado correctamente. Los cambios se reflejarán en la próxima inspección.');
    };
    window.resetChecklist = function() {
      if (confirm('¿Seguro que deseas restaurar las preguntas por defecto?')) {
        currentChecklist = [...DEFAULT_CHECKLIST];
        localStorage.setItem('cm_checklist', JSON.stringify(currentChecklist));
        renderChecklistEditor();
        alert('Checklist restaurado.');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      renderChecklistEditor();
    });

  </script>
</body>
</html>
