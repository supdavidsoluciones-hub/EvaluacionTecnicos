<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moviles - Control Operativo</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; color: #1A2B4A; }
    .top-bar { background: #1A2B4A; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
    .back-btn { color: #fff; text-decoration: none; font-size: 1.4rem; line-height: 1; }
    .top-bar-title { font-size: 1rem; font-weight: 800; flex: 1; display: flex; align-items: center; gap: 8px; }
    .top-bar-title img { width: 26px; height: 18px; object-fit: cover; border-radius: 4px; }
    .content { padding: 16px 16px 40px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .chip { padding: 7px 14px; border-radius: 20px; border: 1.5px solid #DEE2E8; font-size: 0.78rem; font-weight: 700; cursor: pointer; white-space: nowrap; background: #fff; color: #8A94A6; }
    .chip.active { background: #1A2B4A; color: #fff; border-color: #1A2B4A; }
    .mobile-card {
      background: #fff; border: 1px solid #EEF2F7; border-radius: 14px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px; margin-bottom: 10px;
      cursor: pointer; text-decoration: none; color: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); transition: all 0.15s;
    }
    .mobile-card:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.08); transform: translateY(-1px); }
    .mobile-card img { width: 48px; height: 33px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .mobile-info { flex: 1; }
    .mobile-code { font-size: 0.95rem; font-weight: 800; color: #1A2B4A; }
    .mobile-zone { font-size: 0.75rem; color: #8A94A6; margin-top: 2px; }
    .mobile-status { font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .status-activa { background: #E6F9F0; color: #1E7C50; }
    .status-mantenimiento { background: #FFF8E1; color: #B7860D; }
    .status-inactiva { background: #FEE8E8; color: #C0392B; }
    .arrow { font-size: 1.1rem; color: #DEE2E8; }
    .empty-box { text-align: center; padding: 60px 20px; }
    .empty-box img { width: 70px; border-radius: 10px; opacity: 0.35; margin-bottom: 16px; }
    .empty-title { font-weight: 700; color: #AAB4C4; font-size: 1rem; margin-bottom: 6px; }
    .empty-sub { font-size: 0.78rem; color: #C5CDD8; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/app/dashboard.html" class="back-btn">&#8592;</a>
    <div class="top-bar-title">
      <img src="/app/img/van.jpg" alt="van"> Moviles
    </div>
  </div>

  <div class="content">
    <div class="filter-row">
      <div class="chip active" data-zone="all" onclick="setZone('all', this)">Todos</div>
      <div class="chip" data-zone="Chiriqui" onclick="setZone('Chiriqui', this)">Chiriqui</div>
      <div class="chip" data-zone="Santiago" onclick="setZone('Santiago', this)">Santiago</div>
      <div class="chip" data-zone="Panama" onclick="setZone('Panama', this)">Panama</div>
    </div>
    <div id="listContainer">
      <div style="text-align:center; padding:40px; color:#8A94A6; font-size:0.85rem;">Cargando...</div>
    </div>
  </div>

  <script>
    const API = '/api/v1';
    const token = localStorage.getItem('cm_token');
    if (!token) window.location.replace('/app/login.html');

    let allMobiles = [];
    let currentZone = 'all';

    function setZone(zone, el) {
      currentZone = zone;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function render() {
      const container = document.getElementById('listContainer');
      let filtered = allMobiles;
      if (currentZone !== 'all') {
        filtered = allMobiles.filter(m => (m.zone || '').toLowerCase() === currentZone.toLowerCase());
      }

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-box">
            <img src="/app/img/van.jpg" alt="empty">
            <div class="empty-title">` + (allMobiles.length === 0 ? 'No hay moviles registradas' : 'Sin moviles en esta zona') + `</div>
            <div class="empty-sub">` + (allMobiles.length === 0 ? 'Ve a Configuracion para agregar la primera movil.' : 'Prueba con otro filtro de zona.') + `</div>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(m => {
        const statusCls = m.status === 'activa' ? 'status-activa' : m.status === 'mantenimiento' ? 'status-mantenimiento' : 'status-inactiva';
        const statusLabel = m.status === 'activa' ? 'Activa' : m.status === 'mantenimiento' ? 'Mantenimiento' : 'Inactiva';
        return `<a class="mobile-card" href="/app/movil_detalle.html?id=${m.id}">
          <img src="/app/img/van.jpg" alt="${m.code}">
          <div class="mobile-info">
            <div class="mobile-code">${m.code || 'Sin codigo'}</div>
            <div class="mobile-zone">${m.zone || 'Sin zona'} &bull; ${m.plate || 'Sin placa'}</div>
          </div>
          <span class="mobile-status ${statusCls}">${statusLabel}</span>
          <span class="arrow">&#8250;</span>
        </a>`;
      }).join('');
    }

    async function load() {
      try {
        const r = await fetch(API + '/mobiles', { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) { window.location.replace('/app/login.html'); return; }
        allMobiles = await r.json();
        render();
      } catch(e) {
        document.getElementById('listContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#E05252;">Error cargando moviles. Verifica tu conexion.</div>';
      }
    }

    load();
  </script>
</body>
</html>
