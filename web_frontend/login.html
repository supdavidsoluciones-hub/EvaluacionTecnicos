<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- App Icon / Favicon -->
  <link rel="icon" type="image/png" href="/app/img/logo.png" />
  <link rel="apple-touch-icon" href="/app/img/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design System -->
  <link rel="stylesheet" href="/app/css/style.css" />

  <style>
    /* ─── Page Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── CSS Custom Properties ───────────────────────────────── */
    :root {
      --primary:        #4f46e5;
      --primary-dark:   #3730a3;
      --primary-light:  #818cf8;
      --accent:         #06b6d4;
      --accent2:        #8b5cf6;
      --success:        #10b981;
      --danger:         #ef4444;
      --text:           #0f172a;
      --text-muted:     #64748b;
      --surface:        #ffffff;
      --radius:         16px;
      --shadow-lg:      0 20px 60px rgba(79,70,229,.18), 0 4px 16px rgba(0,0,0,.08);
      --transition:     .25s cubic-bezier(.4,0,.2,1);
    }

    /* ─── Body & Background ───────────────────────────────────── */
    body.login-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0b0f1e;
      overflow: hidden;
      padding: 24px 16px;
    }

    /* ─── Animated Gradient Orbs ──────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .55;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
      top: -160px; left: -160px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      bottom: -120px; right: -120px;
      animation-delay: -4s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -8s;
      opacity: .3;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }
    .orb-3 { animation-name: drift3; }
    @keyframes drift3 {
      from { transform: translate(-50%,-50%) scale(1); }
      to   { transform: translate(calc(-50% + 30px), calc(-50% - 25px)) scale(1.12); }
    }

    /* Grid dots overlay */
    body.login-page::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 28px 28px;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Login Box ───────────────────────────────────────────── */
    .login-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeUp .6s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Logo ────────────────────────────────────────────────── */
    .login-logo {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 32px rgba(79,70,229,.6),
        0 0 64px rgba(6,182,212,.35);
      animation: glow 3s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 32px rgba(79,70,229,.6), 0 0 64px rgba(6,182,212,.35); }
      to   { box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 0 48px rgba(79,70,229,.9), 0 0 80px rgba(6,182,212,.5); }
    }

    .logo-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -.025em;
      line-height: 1.2;
    }
    .gradient-text {
      display: block;
      background: linear-gradient(90deg, #818cf8, #06b6d4, #8b5cf6);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 0% center; }
      to   { background-position: 200% center; }
    }

    .logo-sub {
      font-size: .8rem;
      color: rgba(255,255,255,.45);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* ─── Form Card ───────────────────────────────────────────── */
    .login-form-card {
      width: 100%;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      padding: 36px 32px 28px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp .6s .12s cubic-bezier(.4,0,.2,1) both;
    }

    .login-form-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .text-sm {
      font-size: .82rem;
      color: rgba(255,255,255,.45);
      margin-bottom: 28px;
    }

    /* ─── Form Groups ─────────────────────────────────────────── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    .form-group label {
      font-size: .78rem;
      font-weight: 600;
      color: rgba(255,255,255,.65);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      color: #ffffff;
      font-family: inherit;
      font-size: .95rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .form-control::placeholder { color: rgba(255,255,255,.25); }
    .form-control:focus {
      background: rgba(255,255,255,.11);
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(129,140,248,.22);
    }
    .form-control:user-valid:not(:placeholder-shown) {
      border-color: rgba(16,185,129,.6);
    }

    /* Password wrapper */
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .form-control {
      padding-right: 48px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,.4);
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
      transition: color var(--transition);
      display: flex;
      align-items: center;
    }
    .toggle-password:hover { color: rgba(255,255,255,.75); }

    /* ─── Error Message ───────────────────────────────────────── */
    #errorMsg {
      display: none;
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.35);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .84rem;
      margin-bottom: 16px;
      animation: shake .35s ease;
    }
    #errorMsg.visible { display: block; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%    { transform:translateX(-6px); }
      60%    { transform:translateX(6px); }
    }

    /* ─── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(79,70,229,.45);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 6px 28px rgba(79,70,229,.65);
      filter: brightness(1.08);
    }
    .btn-primary:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
    .btn-full { width: 100%; }
    .btn-lg   { padding: 14px 24px; font-size: 1rem; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .loading .spinner { display: block; }
    .loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Footer ──────────────────────────────────────────────── */
    .login-footer {
      text-align: center;
      font-size: .75rem;
      color: rgba(255,255,255,.25);
      margin-top: 22px;
    }

    /* ─── Responsive tweaks ───────────────────────────────────── */
    @media (max-width: 380px) {
      .login-form-card { padding: 28px 20px 22px; }
      .logo-title { font-size: 1.35rem; }
    }
  </style>
</head>
<body class="login-page">

  <!-- Animated background orbs -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <!-- Main container -->
  <div class="login-box">

    <!-- Logo -->
    <div class="login-logo">
      <img src="/app/img/logo.png" alt="Control Operativo de las Móviles" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 35px rgba(0, 212, 170, 0.45); border: 2px solid rgba(255,255,255,0.15);" />
      <p class="logo-sub" style="margin-top: 10px;">Chiriquí &amp; Santiago &bull; Panamá</p>
    </div>

    <!-- Form card -->
    <div class="login-form-card">
      <h2>Iniciar Sesión</h2>
      <p class="text-sm">Acceso exclusivo para personal autorizado</p>

      <form id="loginForm" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            id="username"
            class="form-control"
            type="text"
            placeholder="Tu usuario"
            required
            autocomplete="username"
            spellcheck="false"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input
              id="password"
              class="form-control"
              type="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              aria-label="Mostrar u ocultar contraseña"
              title="Mostrar/ocultar contraseña"
            >
              <!-- Eye icon (SVG) -->
              <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye-off icon (SVG) -->
              <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Error message -->
        <div id="errorMsg" role="alert"></div>

        <!-- Submit -->
        <button id="btnLogin" class="btn btn-primary btn-full btn-lg" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Ingresar</span>
        </button>

      </form>

      <p class="login-footer">Sistema de Control Operativo v1.0</p>
    </div>

  </div><!-- /.login-box -->

  <script type="module">
    // ── Inline import of app.js helpers ─────────────────────────
    import { isAuthenticated, login, showToast } from '/app/js/app.js';

    // ── Redirect if already logged in ───────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logout') === 'true') {
        localStorage.removeItem('cm_token');
        localStorage.removeItem('cm_user');
      }

      if (isAuthenticated()) {
        window.location.href = '/app/dashboard.html';
        return;
      }

      const form      = document.getElementById('loginForm');
      const btnLogin  = document.getElementById('btnLogin');
      const errorMsg  = document.getElementById('errorMsg');
      const pwdInput  = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      const iconEye   = document.getElementById('iconEye');
      const iconOff   = document.getElementById('iconEyeOff');

      // ── Toggle password visibility ─────────────────────────────
      toggleBtn.addEventListener('click', () => {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type = isHidden ? 'text' : 'password';
        iconEye.style.display = isHidden ? 'none'  : '';
        iconOff.style.display = isHidden ? ''      : 'none';
        toggleBtn.setAttribute('aria-pressed', String(isHidden));
      });

      // ── Helpers ────────────────────────────────────────────────
      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
        // Reset animation
        errorMsg.style.animation = 'none';
        void errorMsg.offsetHeight;          // reflow
        errorMsg.style.animation = '';
      }
      function hideError() {
        errorMsg.classList.remove('visible');
      }
      function setLoading(on) {
        btnLogin.disabled = on;
        btnLogin.classList.toggle('loading', on);
      }

      // ── Form submit ────────────────────────────────────────────
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const username = document.getElementById('username').value.trim();
        const password = pwdInput.value;

        if (!username || !password) {
          showError('Por favor completá usuario y contraseña.');
          return;
        }

        setLoading(true);

        try {
          // login() uses URLSearchParams + application/x-www-form-urlencoded
          const data = await login(username, password);

          // Persist token and user in localStorage
          localStorage.setItem('cm_token', data.access_token);
          localStorage.setItem('cm_user', JSON.stringify(data.user ?? { username }));

          showToast('Sesión iniciada correctamente 🎉', 'success');

          // Small delay so the toast is visible before navigation
          setTimeout(() => {
            window.location.href = '/app/dashboard.html';
          }, 600);

        } catch (err) {
          showError(err.message || 'Credenciales incorrectas. Intentá de nuevo.');
          setLoading(false);
        }
      });
    });
  </script>

</body>
</html>
