<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- App Icon / Favicon -->
  <link rel="icon" type="image/png" href="/app/img/logo.png" />
  <link rel="apple-touch-icon" href="/app/img/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design System -->
  <link rel="stylesheet" href="/app/css/style.css?v=2" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #1A2B4A;
      --navy-dark:   #111E36;
      --petrol:      #1C3D4F;
      --steel:       #3A6080;
      --graphite:    #2D3342;
      --radius:      16px;
      --shadow-lg:   0 20px 60px rgba(17,30,54,.45), 0 4px 20px rgba(0,0,0,.2);
      --transition:  .25s cubic-bezier(.4,0,.2,1);
    }

    body.login-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0D1826 0%, #111E36 50%, #0D2333 100%);
      overflow: hidden;
      padding: 24px 16px;
    }

    body.login-page::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0; pointer-events: none;
    }

    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(100px); opacity: .2;
      animation: drift 14s ease-in-out infinite alternate;
      pointer-events: none; z-index: 0;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #1A2B4A 0%, transparent 70%);
      top: -180px; left: -180px;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #1C3D4F 0%, transparent 70%);
      bottom: -140px; right: -140px; animation-delay: -5s;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #234F65 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -9s; opacity: .15;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }
    .orb-3 { animation-name: drift3; }
    @keyframes drift3 {
      from { transform: translate(-50%,-50%) scale(1); }
      to   { transform: translate(calc(-50% + 20px), calc(-50% - 18px)) scale(1.1); }
    }

    .login-box {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column;
      align-items: center; gap: 28px;
      animation: fadeUp .55s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center; display: flex;
      flex-direction: column; align-items: center; gap: 12px;
    }
    .logo-sub {
      font-size: .8rem; color: rgba(255,255,255,.35);
      letter-spacing: .07em; text-transform: uppercase;
    }

    .login-form-card {
      width: 100%;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: var(--radius);
      padding: 36px 32px 28px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp .55s .1s cubic-bezier(.4,0,.2,1) both;
    }
    .login-form-card h2 {
      font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 4px;
    }
    .text-sm {
      font-size: .82rem; color: rgba(255,255,255,.38); margin-bottom: 26px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label {
      font-size: .75rem; font-weight: 700;
      color: rgba(255,255,255,.5);
      letter-spacing: .05em; text-transform: uppercase;
    }
    .form-control {
      width: 100%; padding: 12px 15px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; color: #fff;
      font-family: inherit; font-size: .93rem; outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .form-control::placeholder { color: rgba(255,255,255,.2); }
    .form-control:focus {
      background: rgba(255,255,255,.1);
      border-color: rgba(58,96,128,.8);
      box-shadow: 0 0 0 3px rgba(58,96,128,.2);
    }

    .input-wrapper { position: relative; }
    .input-wrapper .form-control { padding-right: 48px; }
    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.35); font-size: 1.1rem;
      line-height: 1; padding: 4px;
      transition: color var(--transition); display: flex; align-items: center;
    }
    .toggle-password:hover { color: rgba(255,255,255,.7); }

    #errorMsg {
      display: none;
      background: rgba(139,58,58,.2);
      border: 1px solid rgba(139,58,58,.4);
      color: #EDACAC;
      border-radius: 8px; padding: 10px 14px;
      font-size: .84rem; margin-bottom: 14px;
      animation: shake .35s ease;
    }
    #errorMsg.visible { display: block; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      25%    { transform:translateX(-5px); }
      75%    { transform:translateX(5px); }
    }

    .btn {
      display: inline-flex; align-items: center;
      justify-content: center; gap: 8px;
      border: none; border-radius: 10px;
      font-family: inherit; font-weight: 700;
      cursor: pointer; transition: all var(--transition);
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, #1A2B4A 0%, #234F65 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(17,30,54,.5);
      border: 1px solid rgba(255,255,255,.08);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #111E36 0%, #1C3D4F 100%);
      box-shadow: 0 6px 28px rgba(17,30,54,.65);
    }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .btn-full { width: 100%; }
    .btn-lg   { padding: 14px 24px; font-size: 1rem; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }
    .loading .spinner { display: block; }
    .loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center; font-size: .75rem;
      color: rgba(255,255,255,.2); margin-top: 20px;
    }

    @media (max-width: 380px) {
      .login-form-card { padding: 26px 18px 22px; }
    }
  </style>
</head>
<body class="login-page">

  <!-- Animated background orbs -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <!-- Main container -->
  <div class="login-box">

    <!-- Logo -->
    <div class="login-logo">
      <img src="/app/img/logo.png" alt="Control Operativo de las MÃ³viles" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 35px rgba(0, 212, 170, 0.45); border: 2px solid rgba(255,255,255,0.15);" />
      <p class="logo-sub" style="margin-top: 10px;">ChiriquÃ­ &amp; Santiago &bull; PanamÃ¡</p>
    </div>

    <!-- Form card -->
    <div class="login-form-card">
      <div id="sessionNotice"></div>
      <h2>Iniciar SesiÃ³n</h2>
      <p class="text-sm">Acceso exclusivo para personal autorizado</p>

      <form id="loginForm" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            id="username"
            class="form-control"
            type="text"
            placeholder="Tu usuario"
            required
            autocomplete="username"
            spellcheck="false"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">ContraseÃ±a</label>
          <div class="input-wrapper">
            <input
              id="password"
              class="form-control"
              type="password"
              placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              aria-label="Mostrar u ocultar contraseÃ±a"
              title="Mostrar/ocultar contraseÃ±a"
            >
              <!-- Eye icon (SVG) -->
              <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye-off icon (SVG) -->
              <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Error message -->
        <div id="errorMsg" role="alert"></div>

        <!-- Submit -->
        <button id="btnLogin" class="btn btn-primary btn-full btn-lg" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Ingresar</span>
        </button>

      </form>

      <p class="login-footer">Sistema de Control Operativo v1.0</p>
    </div>

  </div><!-- /.login-box -->

  <script type="module">
    import { isAuthenticated, login, getUser } from '/app/js/app.js';

    document.addEventListener('DOMContentLoaded', () => {

      // Limpiar tokens viejos/invÃ¡lidos al cargar la pÃ¡gina de login
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logout') === 'true') {
        localStorage.removeItem('cm_token');
        localStorage.removeItem('cm_user');
      }

      // Si ya tiene sesiÃ³n activa, ir directo al dashboard
      if (isAuthenticated()) {
        window.location.replace('/app/dashboard.html');
        return;
      }

      const form      = document.getElementById('loginForm');
      const btnLogin  = document.getElementById('btnLogin');
      const errorMsg  = document.getElementById('errorMsg');
      const pwdInput  = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      const iconEye   = document.getElementById('iconEye');
      const iconOff   = document.getElementById('iconEyeOff');

      // Toggle mostrar/ocultar contraseÃ±a
      toggleBtn.addEventListener('click', () => {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type = isHidden ? 'text' : 'password';
        iconEye.style.display = isHidden ? 'none' : '';
        iconOff.style.display = isHidden ? '' : 'none';
        toggleBtn.setAttribute('aria-pressed', String(isHidden));
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
        errorMsg.style.animation = 'none';
        void errorMsg.offsetHeight;
        errorMsg.style.animation = '';
      }
      function hideError() { errorMsg.classList.remove('visible'); }
      function setLoading(on) {
        btnLogin.disabled = on;
        btnLogin.classList.toggle('loading', on);
      }

      // EnvÃ­o del formulario
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const username = document.getElementById('username').value.trim();
        const password = pwdInput.value;

        if (!username || !password) {
          showError('Por favor completÃ¡ usuario y contraseÃ±a.');
          return;
        }

        setLoading(true);

        try {
          const data = await login(username, password);

          // El backend devuelve user_info
          const userInfo = data.user_info ?? data.user ?? { username };
          localStorage.setItem('cm_token', data.access_token);
          localStorage.setItem('cm_user', JSON.stringify(userInfo));

          window.location.replace('/app/dashboard.html');

        } catch (err) {
          showError(err.message || 'Credenciales incorrectas. IntentÃ¡ de nuevo.');
          setLoading(false);
        }
      });
    });
  </script>

</body>
</html>
