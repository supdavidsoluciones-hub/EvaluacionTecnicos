<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Control Operativo Móviles Chiriquí</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .login-logo {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 5px;
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 30px;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">🚛</div>
        <div class="login-title">Control Operativo</div>
        <div class="login-subtitle">Móviles de Técnicos – Chiriquí</div>

        <div id="alertError" class="alert-error"></div>

        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label for="username">Usuario</label>
                <input type="text" id="username" class="input-control" placeholder="Ej. admin o supervisor" required autocomplete="username">
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="input-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 10px;">
                <span>🔐 Iniciar Sesión</span>
            </button>
        </form>
    </div>

    <script>
        const API_BASE = "/api/v1";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertError = document.getElementById('alertError');
            alertError.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Error al iniciar sesión');
                }

                // Guardar Token e información de usuario en localStorage
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_info', JSON.stringify(data.user_info));

                // Redireccionar al Dashboard principal
                window.location.href = '/app/';
            } catch (err) {
                alertError.textContent = err.message;
                alertError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
