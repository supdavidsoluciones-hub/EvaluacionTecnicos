<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metricas - Control Operativo</title>
  <link rel="icon" type="image/png" href="/app/img/logo.png">
  <link rel="apple-touch-icon" href="/app/img/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1A2B4A; }
    .top-bar { background: #1A2B4A; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
    .back-btn { color: #fff; text-decoration: none; font-size: 1.4rem; line-height: 1; }
    .top-bar strong { font-size: 1rem; font-weight: 800; }
    .content { padding: 16px 16px 80px; }
    
    .filter-card { background: #fff; border-radius: 14px; border: 1px solid #EEF2F7; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .fc-title { font-size: 0.75rem; font-weight: 800; color: #8A94A6; text-transform: uppercase; margin-bottom: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .fgroup label { display: block; font-size: 0.72rem; font-weight: 700; color: #8A94A6; margin-bottom: 4px; }
    .fgroup input, .fgroup select { width: 100%; padding: 8px 10px; border: 1px solid #DEE2E8; border-radius: 8px; font-size: 0.85rem; background: #F9FAFB; }
    .btn-action { width: 100%; background: #1A2B4A; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    
    .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 14px 10px; border: 1px solid #EEF2F7; text-align: center; }
    .sc-val { font-size: 1.6rem; font-weight: 800; color: #1A2B4A; margin-bottom: 4px; }
    .sc-lbl { font-size: 0.65rem; font-weight: 700; color: #8A94A6; text-transform: uppercase; }

    .sec-label { font-size: 0.75rem; font-weight: 800; color: #8A94A6; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .list-card { background: #fff; border: 1px solid #EEF2F7; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
    .lc-main { font-weight: 700; font-size: 0.9rem; color: #1A2B4A; }
    .lc-sub { font-size: 0.72rem; color: #8A94A6; }
    .lc-badge { font-weight: 800; font-size: 1rem; color: #4A7C6F; }
    .lc-badge-err { color: #C0392B; }

    .btn-export { width: 100%; background: #1E7C50; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/app/dashboard.html" class="back-btn">&#8592;</a>
    <strong>METRICAS Y REPORTES</strong>
  </div>

  <div class="content">
    <div class="filter-card">
      <div class="fc-title">Filtros de Datos</div>
      <div class="row">
        <div class="fgroup"><label>Region</label>
          <select id="fZone">
            <option value="Todas">Todas</option>
            <option value="Chiriqui">Chiriqui</option>
            <option value="Veraguas">Veraguas</option>
            <option value="Panama">Panama</option>
          </select>
        </div>
        <div class="fgroup"><label>Movil Especifica</label>
          <select id="fMobile"><option value="">-- Todas --</option></select>
        </div>
      </div>
      <div class="row">
        <div class="fgroup"><label>Desde</label><input type="date" id="fFrom"></div>
        <div class="fgroup"><label>Hasta</label><input type="date" id="fTo"></div>
      </div>
      <button class="btn-action" onclick="loadData()">Aplicar Filtros</button>
      <button class="btn-export" id="btnExport" onclick="exportData()">📥 Descargar Excel del Filtro</button>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="sc-val" id="stTotal">-</div>
        <div class="sc-lbl">Inspecciones</div>
      </div>
      <div class="stat-card">
        <div class="sc-val" id="stOk">-</div>
        <div class="sc-lbl">Cumplen</div>
      </div>
      <div class="stat-card">
        <div class="sc-val" id="stErr">-</div>
        <div class="sc-lbl">No Cumplen</div>
      </div>
    </div>

    <div class="sec-label">Rendimiento por Movil (Filtrado)</div>
    <div id="rankList">
      <div class="list-card"><div class="lc-sub">Cargando...</div></div>
    </div>

  </div>

  <script>
    const API = '/api/v1';
    const token = localStorage.getItem('cm_token');
    if (!token) localStorage.removeItem('cm_token'); window.location.replace('/app/login.html');

    // Default dates
    const today = new Date();
    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    document.getElementById('fFrom').value = firstDay.toISOString().split('T')[0];
    document.getElementById('fTo').value = today.toISOString().split('T')[0];

    let allMobiles = [];

    async function init() {
      try {
        const rm = await fetch(API + '/mobiles', { headers: { 'Authorization': 'Bearer ' + token } });
        allMobiles = await rm.json();
        
        const sel = document.getElementById('fMobile');
        allMobiles.forEach(m => {
          const o = document.createElement('option');
          o.value = m.id;
          o.textContent = m.code + ' - ' + (m.zone || '');
          sel.appendChild(o);
        });
        
        loadData();
      } catch(e) { console.error(e); }
    }

    async function loadData() {
      const z = document.getElementById('fZone').value.toLowerCase();
      const mid = document.getElementById('fMobile').value;
      const f = document.getElementById('fFrom').value;
      const t = document.getElementById('fTo').value;

      try {
        const r = await fetch(API + `/inspections?limit=1000`, { headers: { 'Authorization': 'Bearer ' + token } });
        let insps = await r.json();

        // Filter by Date
        if (f) insps = insps.filter(i => i.inspection_date >= f);
        if (t) insps = insps.filter(i => i.inspection_date <= t);
        
        // Filter by Mobile ID
        if (mid) insps = insps.filter(i => i.mobile_id == mid);
        
        // Filter by Zone
        if (z !== 'todas') {
          insps = insps.filter(i => {
            const m = allMobiles.find(x => x.id === i.mobile_id) || {};
            const mz = (m.zone || '').toLowerCase();
            if (z === 'veraguas') return mz.includes('veraguas') || mz.includes('santiago');
            return mz.includes(z);
          });
        }

        let ok = 0, err = 0;
        const movData = {}; // stats by mobile

        insps.forEach(i => {
          if (i.general_result === 'Cumple') ok++;
          else if (i.general_result === 'No cumple') err++;
          
          if (!movData[i.mobile_id]) movData[i.mobile_id] = {id: i.mobile_id, total: 0, ok: 0};
          movData[i.mobile_id].total++;
          if (i.general_result === 'Cumple') movData[i.mobile_id].ok++;
        });

        document.getElementById('stTotal').textContent = insps.length;
        document.getElementById('stOk').textContent = ok;
        document.getElementById('stErr').textContent = err;

        const rankArr = Object.values(movData).sort((a,b) => b.total - a.total);
        const list = document.getElementById('rankList');
        
        if (!rankArr.length) {
          list.innerHTML = '<div class="list-card"><div class="lc-sub">No hay inspecciones para estos filtros.</div></div>';
        } else {
          list.innerHTML = rankArr.map(d => {
            const m = allMobiles.find(x => x.id === d.id) || {};
            const pct = Math.round((d.ok / d.total) * 100);
            const cls = pct >= 80 ? 'lc-badge' : 'lc-badge lc-badge-err';
            return `<div class="list-card">
              <div>
                <div class="lc-main">${m.code || 'M?'}</div>
                <div class="lc-sub">${d.total} Insp. &bull; ${m.zone || 'Sin zona'}</div>
              </div>
              <div class="${cls}">${pct}% OK</div>
            </div>`;
          }).join('');
        }
      } catch(e) { console.error(e); }
    }

    async function exportData() {
      const from = document.getElementById('fFrom').value;
      const to = document.getElementById('fTo').value;
      const mid = document.getElementById('fMobile').value;
      
      // We will just use the same export endpoint. The API currently only supports from/to.
      // Si quisieras que el backend filtre por movil, deberias modificar backend export endpoint.
      // Por ahora exportamos el rango de fechas.
      const btn = document.getElementById('btnExport');
      btn.disabled = true; btn.textContent = 'Descargando...';

      try {
        const r = await fetch(API + '/inspections/export?from=' + from + '&to=' + to, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!r.ok) { alert('Error al exportar.'); return; }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Inspecciones_' + from + '_al_' + to + '.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch(e) {
        alert('Error: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = '📥 Descargar Excel del Filtro';
      }
    }

    init();
  </script>
</body>
</html>
