<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes Diarias - Control Chiriquí</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .top-bar {
            background: #0f172a;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .back-link { color: white; text-decoration: none; font-size: 1.2rem; }
        .order-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .time-badge-exceeded {
            background: #fee2e2;
            color: #991b1b;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="/app/" class="back-link">←</a>
        <strong style="font-size: 1.1rem;">CONTROL DIARIO DE ÓRDENES</strong>
    </div>

    <main class="main-container" style="margin-top: 20px;">

        <!-- Formulario Rápido de Registro de Orden -->
        <div class="form-card" style="padding: 24px;">
            <div class="section-title" style="font-size: 1.1rem;">
                <span>➕ Registrar Nueva Orden</span>
            </div>

            <form id="newOrderForm">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="ordNum">Número de Orden *</label>
                        <input type="text" id="ordNum" class="input-control" placeholder="Ej. 45830" required>
                    </div>

                    <div class="form-group">
                        <label for="ordMobile">Móvil *</label>
                        <select id="ordMobile" class="select-control" required></select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="ordTech">Técnico Responsable *</label>
                        <select id="ordTech" class="select-control" required></select>
                    </div>

                    <div class="form-group">
                        <label for="ordType">Tipo de Trabajo *</label>
                        <select id="ordType" class="select-control" required>
                            <option value="Instalación">Instalación (Ref 45 min)</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                            <option value="Avería">Avería</option>
                            <option value="Retiro">Retiro</option>
                            <option value="Configuración">Configuración</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="ordStart">Hora Inicio (HH:MM) *</label>
                        <input type="time" id="ordStart" class="input-control" required>
                    </div>

                    <div class="form-group">
                        <label for="ordEnd">Hora Fin (HH:MM) *</label>
                        <input type="time" id="ordEnd" class="input-control" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>💾 Guardar Orden</span>
                </button>
            </form>
        </div>

        <!-- Lista de Órdenes Registradas -->
        <div class="section-title">
            <span class="section-icon">📋</span>
            <span>Órdenes del Día</span>
        </div>

        <div id="ordersListContainer">
            <div style="text-align: center; color: #64748b; padding: 20px;">Cargando órdenes...</div>
        </div>

    </main>

    <script>
        const API_BASE = "/api/v1";
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = '/app/login.html';

        let mobilesList = [];

        async function initOrdersPage() {
            // Cargar Móviles y Técnicos
            const resM = await fetch(`${API_BASE}/mobiles`, { headers: { 'Authorization': `Bearer ${token}` } });
            mobilesList = await resM.json();
            const mSelect = document.getElementById('ordMobile');
            mobilesList.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.code;
                mSelect.appendChild(opt);
            });

            const resT = await fetch(`${API_BASE}/technicians`, { headers: { 'Authorization': `Bearer ${token}` } });
            const techs = await resT.json();
            const tSelect = document.getElementById('ordTech');
            techs.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.full_name;
                tSelect.appendChild(opt);
            });

            mSelect.addEventListener('change', () => {
                const selM = mobilesList.find(m => m.id == mSelect.value);
                if (selM && selM.primary_technician) tSelect.value = selM.primary_technician.id;
            });

            cargarOrdenes();
        }

        async function cargarOrdenes() {
            const res = await fetch(`${API_BASE}/orders`, { headers: { 'Authorization': `Bearer ${token}` } });
            const orders = await res.json();
            const container = document.getElementById('ordersListContainer');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">No hay órdenes registradas hoy.</div>';
                return;
            }

            orders.forEach(o => {
                const card = document.createElement('div');
                card.className = 'order-card';
                
                const timeTag = o.exceeds_target_time 
                    ? `<span class="time-badge-exceeded">🔴 SUPERÓ 45 MIN (${o.duration_minutes} min)</span>`
                    : `<span style="font-size: 0.8rem; font-weight: 700; color: #10b981;">⏱️ ${o.duration_minutes} min</span>`;

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <strong style="font-size: 1.05rem; color: #0f172a;">Orden #${o.order_number}</strong>
                        <span class="badge badge-info">${o.mobile_code}</span>
                    </div>
                    <div style="font-size: 0.88rem; color: #475569; margin-bottom: 6px;">
                        <strong>${o.order_type}</strong> | Técnico: ${o.primary_technician_name || 'N/A'}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: #64748b;">
                        <span>Horario: ${o.start_time || '--:--'} - ${o.end_time || '--:--'}</span>
                        ${timeTag}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('newOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                order_number: document.getElementById('ordNum').value.trim(),
                mobile_id: parseInt(document.getElementById('ordMobile').value),
                primary_technician_id: parseInt(document.getElementById('ordTech').value),
                order_type: document.getElementById('ordType').value,
                start_time: document.getElementById('ordStart').value,
                end_time: document.getElementById('ordEnd').value,
                status: 'Completada'
            };

            const res = await fetch(`${API_BASE}/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('¡Orden guardada exitosamente!');
                document.getElementById('ordNum').value = '';
                cargarOrdenes();
            } else {
                const err = await res.json();
                alert('Error: ' + (err.detail || 'No se pudo guardar la orden'));
            }
        });

        initOrdersPage();
    </script>
</body>
</html>
