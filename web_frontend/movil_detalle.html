<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Movil</title>
  <link rel="icon" type="image/png" href="/app/img/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1A2B4A; }

    /* Top bar */
    .top-bar { background: #1A2B4A; color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
    .back-btn { color: #fff; text-decoration: none; font-size: 1.4rem; line-height: 1; }
    .top-bar strong { font-size: 0.95rem; font-weight: 800; flex: 1; }

    .content { padding: 14px 14px 80px; }

    /* Hero card */
    .hero { background: #fff; border-radius: 18px; border: 1px solid #EEF2F7; padding: 18px; margin-bottom: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
    .hero-top { display: flex; gap: 14px; align-items: center; }
    .hero-img { width: 80px; height: 56px; object-fit: cover; border-radius: 12px; border: 2px solid #EEF2F7; flex-shrink: 0; }
    .hero-info { flex: 1; }
    .hero-code { font-size: 1.6rem; font-weight: 900; color: #1A2B4A; line-height: 1; }
    .hero-model { font-size: 0.8rem; color: #4A7C6F; font-weight: 600; margin: 3px 0; }
    .hero-meta { font-size: 0.72rem; color: #8A94A6; }
    .hero-edit { background: #F5F7FA; border: 1px solid #DEE2E8; border-radius: 8px; padding: 7px 9px; cursor: pointer; font-size: 0.78rem; font-weight: 700; color: #1A2B4A; flex-shrink: 0; }
    
    /* Status section */
    .status-section { background: #fff; border-radius: 14px; border: 1px solid #EEF2F7; padding: 14px; margin-bottom: 14px; }
    .ss-title { font-size: 0.75rem; font-weight: 800; color: #8A94A6; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .ss-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .ss-field label { display: block; font-size: 0.7rem; font-weight: 700; color: #8A94A6; margin-bottom: 4px; }
    .ss-field select, .ss-field textarea { width: 100%; padding: 8px 10px; border: 1px solid #DEE2E8; border-radius: 8px; font-size: 0.82rem; background: #F9FAFB; font-family: inherit; }
    .ss-field textarea { resize: vertical; min-height: 60px; }
    .btn-save-status { width: 100%; background: #4A7C6F; color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    .btn-save-status:hover { background: #3a6359; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; background: #EEF2F7; border-radius: 12px; padding: 4px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 8px 6px; text-align: center; font-size: 0.72rem; font-weight: 700; border-radius: 8px; cursor: pointer; color: #8A94A6; border: none; background: transparent; }
    .tab.active { background: #1A2B4A; color: #fff; }

    /* Tecnico tab */
    .tech-card { background: #fff; border: 1px solid #EEF2F7; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; }
    .tech-avatar { width: 44px; height: 44px; border-radius: 50%; background: #E8F4FF; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .tech-name { font-weight: 700; font-size: 0.9rem; }
    .tech-role { font-size: 0.72rem; color: #4A7C6F; font-weight: 700; text-transform: uppercase; }
    .btn-assign { width: 100%; background: #1A2B4A; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 0.88rem; font-weight: 700; cursor: pointer; margin-top: 10px; }

    /* Inventario tab */
    .inv-cat-title { font-size: 0.72rem; font-weight: 800; color: #8A94A6; text-transform: uppercase; padding: 10px 0 6px; }
    .inv-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #EEF2F7; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
    .inv-name { font-size: 0.82rem; font-weight: 600; flex: 1; }
    .inv-qty { font-size: 0.78rem; color: #8A94A6; margin: 0 10px; }
    .inv-status { font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .s-ok { background: #E6F9F0; color: #1E7C50; }
    .s-low { background: #FFF8E1; color: #B7860D; }
    .s-miss { background: #FEE8E8; color: #C0392B; }
    .btn-save-inv { width: 100%; background: #4A7C6F; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 0.88rem; font-weight: 700; cursor: pointer; margin-top: 12px; }

    /* Inspecciones tab */
    .insp-card { background: #fff; border: 1px solid #EEF2F7; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; }
    .insp-code { font-weight: 700; font-size: 0.85rem; }
    .insp-date { font-size: 0.72rem; color: #8A94A6; margin-top: 2px; }
    .insp-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    .b-ok { background: #E6F9F0; color: #1E7C50; }
    .b-no { background: #FEE8E8; color: #C0392B; }
    .b-na { background: #F5F7FA; color: #8A94A6; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 22px 18px 40px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
    .modal-handle { width: 36px; height: 4px; background: #DEE2E8; border-radius: 2px; margin: 0 auto 18px; }
    .modal-title { font-weight: 800; font-size: 1rem; margin-bottom: 16px; }
    .fgroup { margin-bottom: 12px; }
    .fgroup label { display: block; font-size: 0.72rem; font-weight: 700; color: #8A94A6; margin-bottom: 4px; }
    .fgroup input, .fgroup select { width: 100%; padding: 10px 12px; border: 1px solid #DEE2E8; border-radius: 10px; font-size: 0.88rem; font-family: inherit; background: #F9FAFB; }
    .btn-primary { width: 100%; background: #1A2B4A; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .btn-cancel { width: 100%; background: #F5F7FA; color: #1A2B4A; border: 1px solid #DEE2E8; border-radius: 10px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 8px; }

    .empty-msg { text-align: center; padding: 30px; color: #AAB4C4; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/app/moviles.html" class="back-btn">&#8592;</a>
    <strong id="topTitle">Perfil de Movil</strong>
    <button class="hero-edit" id="btnEdit">&#9998; Editar</button>
  </div>

  <div class="content">
    <!-- Hero card -->
    <div class="hero">
      <div class="hero-top">
        <img src="/app/img/van.jpg" alt="van" class="hero-img" id="heroImg">
        <div class="hero-info">
          <div class="hero-code" id="heroCode">--</div>
          <div class="hero-model" id="heroModel">--</div>
          <div class="hero-meta" id="heroMeta">--</div>
        </div>
      </div>
    </div>

    <!-- Estado del Vehiculo -->
    <div class="status-section">
      <div class="ss-title">&#128660; Estado del Vehiculo</div>
      <div class="ss-row">
        <div class="ss-field">
          <label>Limpieza</label>
          <select id="sClean">
            <option value="Limpio">Limpio</option>
            <option value="Regular">Regular</option>
            <option value="Sucio">Sucio</option>
          </select>
        </div>
        <div class="ss-field">
          <label>Estado General</label>
          <select id="sStatus">
            <option value="activa">Activa</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="inactiva">Inactiva</option>
          </select>
        </div>
      </div>
      <div class="ss-field" style="margin-bottom:12px;">
        <label>Danos / Golpes / Observaciones</label>
        <textarea id="sDamage" placeholder="Ej: Golpe en la puerta trasera..."></textarea>
      </div>
      <button class="btn-save-status" id="btnSaveStatus">Guardar Estado del Vehiculo</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="tecnicos">Tecnicos</button>
      <button class="tab" data-tab="inventario">Inventario</button>
      <button class="tab" data-tab="inspecciones">Inspecciones</button>
    </div>

    <!-- Tab: Tecnicos -->
    <div id="tab-tecnicos" class="tab-panel">
      <div id="techListContainer"><div class="empty-msg">Sin tecnicos asignados.</div></div>
      <button class="btn-assign" id="btnAssignTech">&#128100; Asignar / Cambiar Tecnicos</button>
    </div>

    <!-- Tab: Inventario -->
    <div id="tab-inventario" class="tab-panel" style="display:none;">
      <div id="invContainer"><div class="empty-msg">Cargando inventario...</div></div>
      <button class="btn-save-inv" id="btnSaveInv">Guardar Cambios de Inventario</button>
    </div>

    <!-- Tab: Inspecciones -->
    <div id="tab-inspecciones" class="tab-panel" style="display:none;">
      <div id="inspContainer"><div class="empty-msg">Cargando inspecciones...</div></div>
    </div>
  </div>

  <!-- Modal Edit Mobile -->
  <div class="modal-overlay" id="modalEdit">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">&#9998; Editar Movil</div>
      <div class="fgroup"><label>Codigo</label><input type="text" id="editCode"></div>
      <div class="fgroup"><label>Zona</label>
        <select id="editZone">
          <option value="Chiriqui">Chiriqui</option>
          <option value="Veraguas">Veraguas</option>
          <option value="Panama">Panama</option>
        </select>
      </div>
      <div class="fgroup"><label>Modelo</label><input type="text" id="editModel"></div>
      <div class="fgroup"><label>Placa</label><input type="text" id="editPlate"></div>
      <button class="btn-primary" id="btnSaveEdit">Guardar Cambios</button>
      <button class="btn-cancel" id="btnCancelEdit">Cancelar</button>
    </div>
  </div>

  <!-- Modal Assign Technician -->
  <div class="modal-overlay" id="modalTech">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">&#128100; Asignar Tecnicos</div>
      <div class="fgroup"><label>Tecnico Principal</label>
        <select id="selTechP"><option value="">-- Ninguno --</option></select>
      </div>
      <div class="fgroup"><label>Tecnico Secundario</label>
        <select id="selTechS"><option value="">-- Ninguno --</option></select>
      </div>
      <button class="btn-primary" id="btnSaveTech">Guardar Asignacion</button>
      <button class="btn-cancel" id="btnCancelTech">Cancelar</button>
    </div>
  </div>

  <script>
    var API = '/api/v1';
    var token = localStorage.getItem('cm_token');
    if (!token) { localStorage.removeItem('cm_token'); window.location.replace('/app/login.html'); return; }

    var mobileId = new URLSearchParams(location.search).get('id');
    if (!mobileId) window.location.replace('/app/moviles.html');

    var mobileData = {};
    var inventoryData = [];
    var allTechs = [];

    // ── Fetch mobile data ──
    async function loadMobile() {
      try {
        var r = await fetch(API + '/mobiles/' + mobileId + '/profile', { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 401) { localStorage.removeItem('cm_token'); window.location.replace('/app/login.html'); return; }
        if (!r.ok) { alert('Movil no encontrada.'); window.location.replace('/app/moviles.html'); return; }
        mobileData = await r.json();
        renderHero();
        loadTechs();
        loadInventory();
        loadInspections();
      } catch(e) { console.error(e); }
    }

    function renderHero() {
      document.getElementById('topTitle').textContent = 'Movil ' + mobileData.code;
      document.getElementById('heroCode').textContent = mobileData.code || '--';
      document.getElementById('heroModel').textContent = mobileData.vehicle_model || 'Sin modelo';
      document.getElementById('heroMeta').textContent = (mobileData.zone || '') + ' • ' + (mobileData.plate || 'Sin placa') + ' • ' + (mobileData.status || 'activa');
      document.getElementById('sClean').value = mobileData.cleanliness_status || 'Limpio';
      document.getElementById('sStatus').value = mobileData.status || 'activa';
      document.getElementById('sDamage').value = mobileData.damage_status || '';
    }

    // ── Tabs ──
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var name = tab.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach(function(p) { p.style.display = 'none'; });
        document.getElementById('tab-' + name).style.display = 'block';
      });
    });

    // ── Save Status ──
    document.getElementById('btnSaveStatus').addEventListener('click', async function() {
      var btn = this;
      btn.disabled = true; btn.textContent = 'Guardando...';
      try {
        var r = await fetch(API + '/mobiles/' + mobileId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            cleanliness_status: document.getElementById('sClean').value,
            status: document.getElementById('sStatus').value,
            damage_status: document.getElementById('sDamage').value
          })
        });
        if (!r.ok) { var d = await r.json(); alert('Error: ' + (d.detail || r.status)); return; }
        mobileData = await r.json();
        renderHero();
        alert('Estado actualizado.');
      } catch(e) { alert('Error: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = 'Guardar Estado del Vehiculo'; }
    });

    // ── Edit Modal ──
    document.getElementById('btnEdit').addEventListener('click', function() {
      document.getElementById('editCode').value = mobileData.code || '';
      document.getElementById('editZone').value = mobileData.zone || 'Chiriqui';
      document.getElementById('editModel').value = mobileData.vehicle_model || '';
      document.getElementById('editPlate').value = mobileData.plate || '';
      document.getElementById('modalEdit').classList.add('open');
    });
    document.getElementById('btnCancelEdit').addEventListener('click', function() {
      document.getElementById('modalEdit').classList.remove('open');
    });
    document.getElementById('modalEdit').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    document.getElementById('btnSaveEdit').addEventListener('click', async function() {
      var btn = this; btn.disabled = true; btn.textContent = 'Guardando...';
      try {
        var r = await fetch(API + '/mobiles/' + mobileId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            code: document.getElementById('editCode').value.trim(),
            zone: document.getElementById('editZone').value,
            vehicle_model: document.getElementById('editModel').value.trim(),
            plate: document.getElementById('editPlate').value.trim()
          })
        });
        if (!r.ok) { var d = await r.json(); alert('Error: ' + (d.detail || r.status)); return; }
        mobileData = await r.json();
        document.getElementById('modalEdit').classList.remove('open');
        renderHero();
        alert('Movil actualizada.');
      } catch(e) { alert('Error: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = 'Guardar Cambios'; }
    });

    // ── Technicians ──
    async function loadTechs() {
      try {
        var rt = await fetch(API + '/technicians', { headers: { 'Authorization': 'Bearer ' + token } });
        allTechs = await rt.json();
        
        // Render assigned techs in the tab
        var pTech = mobileData.primary_technician;
        var sTech = mobileData.secondary_technician;
        var container = document.getElementById('techListContainer');
        
        if (!pTech && !sTech) {
          container.innerHTML = '<div class="empty-msg">Sin tecnicos asignados.<br>Usa el boton de abajo para asignar.</div>';
        } else {
          container.innerHTML = [
            pTech ? '<div class="tech-card"><div class="tech-avatar">&#128100;</div><div><div class="tech-name">' + pTech.full_name + '</div><div class="tech-role">Principal</div></div></div>' : '',
            sTech ? '<div class="tech-card"><div class="tech-avatar">&#128100;</div><div><div class="tech-name">' + sTech.full_name + '</div><div class="tech-role">Secundario</div></div></div>' : ''
          ].join('');
        }

        // Populate selects in modal
        var sp = document.getElementById('selTechP');
        var ss = document.getElementById('selTechS');
        sp.innerHTML = '<option value="">-- Ninguno --</option>';
        ss.innerHTML = '<option value="">-- Ninguno --</option>';
        allTechs.forEach(function(t) {
          sp.innerHTML += '<option value="' + t.id + '">' + t.full_name + '</option>';
          ss.innerHTML += '<option value="' + t.id + '">' + t.full_name + '</option>';
        });
        if (pTech) sp.value = pTech.id;
        if (sTech) ss.value = sTech.id;
      } catch(e) { console.error(e); }
    }

    document.getElementById('btnAssignTech').addEventListener('click', function() {
      document.getElementById('modalTech').classList.add('open');
    });
    document.getElementById('btnCancelTech').addEventListener('click', function() {
      document.getElementById('modalTech').classList.remove('open');
    });
    document.getElementById('modalTech').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    document.getElementById('btnSaveTech').addEventListener('click', async function() {
      var btn = this; btn.disabled = true; btn.textContent = 'Guardando...';
      var pId = document.getElementById('selTechP').value;
      var sId = document.getElementById('selTechS').value;
      if (!pId) { alert('Debe seleccionar al menos un tecnico principal'); btn.disabled = false; btn.textContent = 'Guardar Asignacion'; return; }
      
      try {
        var r = await fetch(API + '/mobiles/' + mobileId + '/assign-technicians', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ 
            primary_technician_id: parseInt(pId), 
            secondary_technician_id: sId ? parseInt(sId) : null 
          })
        });
        if (!r.ok) { var d = await r.json(); alert('Error: ' + (d.detail || r.status)); return; }
        document.getElementById('modalTech').classList.remove('open');
        loadMobile();
        alert('Tecnicos asignados.');
      } catch(e) { alert('Error: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = 'Guardar Asignacion'; }
    });

    // ── Inventory ──
    async function loadInventory() {
      try {
        var r = await fetch(API + '/mobiles/' + mobileId + '/inventory', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!r.ok) { document.getElementById('invContainer').innerHTML = '<div class="empty-msg">Sin inventario disponible.</div>'; return; }
        inventoryData = await r.json();
        renderInventory();
      } catch(e) {
        document.getElementById('invContainer').innerHTML = '<div class="empty-msg">Error cargando inventario.</div>';
      }
    }

    function renderInventory() {
      var container = document.getElementById('invContainer');
      if (!inventoryData.length) { container.innerHTML = '<div class="empty-msg">Sin herramientas en inventario.</div>'; return; }

      var cats = {};
      inventoryData.forEach(function(item) {
        if (!cats[item.category]) cats[item.category] = [];
        cats[item.category].push(item);
      });

      var html = '';
      Object.keys(cats).forEach(function(cat) {
        html += '<div class="inv-cat-title">' + cat + '</div>';
        cats[cat].forEach(function(item) {
          var pct = item.quantity_required > 0 ? item.quantity_current / item.quantity_required : 1;
          var sc = pct >= 1 ? 's-ok' : pct > 0 ? 's-low' : 's-miss';
          var sl = pct >= 1 ? 'OK' : pct > 0 ? 'Incompleto' : 'Falta';
          html += '<div class="inv-row" data-id="' + item.id + '">'
            + '<span class="inv-name">' + item.tool_name + '</span>'
            + '<span class="inv-qty">' + item.quantity_current + '/' + item.quantity_required + '</span>'
            + '<select class="inv-status-sel" data-id="' + item.id + '" style="font-size:0.72rem;border-radius:6px;border:1px solid #DEE2E8;padding:3px 6px;background:#F9FAFB;">'
            + '<option value="ok"' + (item.status === 'ok' ? ' selected' : '') + '>OK</option>'
            + '<option value="incompleto"' + (item.status === 'incompleto' ? ' selected' : '') + '>Incompleto</option>'
            + '<option value="falta"' + (item.status === 'falta' ? ' selected' : '') + '>Falta</option>'
            + '</select>'
            + '</div>';
        });
      });

      container.innerHTML = html;
    }

    document.getElementById('btnSaveInv').addEventListener('click', async function() {
      var btn = this; btn.disabled = true; btn.textContent = 'Guardando...';
      var sels = document.querySelectorAll('.inv-status-sel');
      var updates = [];
      sels.forEach(function(sel) { updates.push({ id: parseInt(sel.dataset.id), status: sel.value }); });

      try {
        await Promise.all(updates.map(function(u) {
          return fetch(API + '/mobiles/' + mobileId + '/inventory/' + u.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ status: u.status })
          });
        }));
        alert('Inventario guardado.');
      } catch(e) { alert('Error: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = 'Guardar Cambios de Inventario'; }
    });

    // ── Inspections ──
    async function loadInspections() {
      try {
        var r = await fetch(API + '/inspections?mobile_id=' + mobileId + '&limit=50', { headers: { 'Authorization': 'Bearer ' + token } });
        var insps = await r.json();
        var container = document.getElementById('inspContainer');
        if (!insps.length) { container.innerHTML = '<div class="empty-msg">Sin inspecciones registradas para esta movil.</div>'; return; }
        container.innerHTML = insps.map(function(i) {
          var cls = i.general_result === 'Cumple' ? 'b-ok' : i.general_result === 'No cumple' ? 'b-no' : 'b-na';
          return '<div class="insp-card">'
            + '<div><div class="insp-code">Orden: ' + (i.order_number || i.inspection_code || '-') + '</div>'
            + '<div class="insp-date">' + (i.inspection_date || '') + ' • ' + (i.client_name || '') + '</div></div>'
            + '<span class="insp-badge ' + cls + '">' + (i.general_result || '-') + '</span>'
            + '</div>';
        }).join('');
      } catch(e) { document.getElementById('inspContainer').innerHTML = '<div class="empty-msg">Error cargando inspecciones.</div>'; }
    }

    loadMobile();
  </script>
</body>
</html>
